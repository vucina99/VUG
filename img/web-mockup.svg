<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Ilustracija web sajta">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5dd3f5"/>
      <stop offset=".5" stop-color="#cffbf6"/>
      <stop offset="1" stop-color="#abbbe5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f4698"/>
      <stop offset="1" stop-color="#261a45"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#5dd3f5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- glow -->
  <circle cx="320" cy="200" r="220" fill="#5dd3f5" opacity="0.12"/>

  <!-- browser window -->
  <g filter="url(#s)">
    <rect x="60" y="60" width="520" height="360" rx="20" fill="#1a1230" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- top bar -->
    <rect x="60" y="60" width="520" height="48" rx="20" fill="#261a45"/>
    <rect x="60" y="88" width="520" height="20" fill="#261a45"/>
    <circle cx="88" cy="84" r="6" fill="#5dd3f5"/>
    <circle cx="110" cy="84" r="6" fill="#cffbf6"/>
    <circle cx="132" cy="84" r="6" fill="#abbbe5"/>
    <rect x="180" y="76" width="320" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>

    <!-- hero block -->
    <rect x="92" y="140" width="200" height="18" rx="9" fill="url(#g1)"/>
    <rect x="92" y="170" width="300" height="12" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="92" y="190" width="260" height="12" rx="6" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="92" y="224" width="120" height="34" rx="17" fill="url(#g1)"/>

    <!-- image placeholder -->
    <rect x="360" y="140" width="188" height="120" rx="14" fill="url(#g2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="410" cy="185" r="16" fill="#cffbf6" opacity="0.85"/>
    <path d="M378 236l34-30 26 20 20-16 34 26v6H378z" fill="#5dd3f5" opacity="0.6"/>

    <!-- cards row -->
    <rect x="92" y="292" width="136" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="252" y="292" width="136" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="412" y="292" width="136" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="112" cy="316" r="10" fill="#5dd3f5"/>
    <circle cx="272" cy="316" r="10" fill="#cffbf6"/>
    <circle cx="432" cy="316" r="10" fill="#abbbe5"/>
    <rect x="108" y="340" width="88" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="268" y="340" width="88" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="428" y="340" width="88" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="108" y="358" width="64" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="268" y="358" width="64" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="428" y="358" width="64" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.1"/>
  </g>
</svg>
