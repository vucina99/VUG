<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Ilustracija digitalnog marketinga">
  <defs>
    <linearGradient id="mg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5dd3f5"/>
      <stop offset=".5" stop-color="#cffbf6"/>
      <stop offset="1" stop-color="#abbbe5"/>
    </linearGradient>
    <linearGradient id="mg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f4698"/>
      <stop offset="1" stop-color="#261a45"/>
    </linearGradient>
    <linearGradient id="mga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5dd3f5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5dd3f5" stop-opacity="0"/>
    </linearGradient>
    <filter id="ms" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#5dd3f5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- glow -->
  <circle cx="320" cy="210" r="220" fill="#5dd3f5" opacity="0.12"/>

  <!-- dashboard prozor -->
  <g filter="url(#ms)">
    <rect x="60" y="60" width="520" height="360" rx="20" fill="#1a1230" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="60" y="60" width="520" height="48" rx="20" fill="#261a45"/>
    <rect x="60" y="88" width="520" height="20" fill="#261a45"/>
    <circle cx="88" cy="84" r="6" fill="#5dd3f5"/>
    <circle cx="110" cy="84" r="6" fill="#cffbf6"/>
    <circle cx="132" cy="84" r="6" fill="#abbbe5"/>
    <rect x="180" y="76" width="320" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>

    <!-- KPI pločice -->
    <rect x="92" y="132" width="140" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="250" y="132" width="140" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="408" y="132" width="140" height="72" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="108" y="150" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="266" y="150" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="424" y="150" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="108" y="170" width="86" height="16" rx="8" fill="url(#mg1)"/>
    <rect x="266" y="170" width="70" height="16" rx="8" fill="#cffbf6" fill-opacity="0.85"/>
    <rect x="424" y="170" width="78" height="16" rx="8" fill="#abbbe5" fill-opacity="0.85"/>
    <path d="M206 182l8-10 8 6 8-12" stroke="#5dd3f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- grafikon rasta -->
    <rect x="92" y="222" width="298" height="168" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M110 362 L150 344 L190 350 L230 318 L270 326 L310 290 L350 272 L372 250 L372 372 L110 372 Z" fill="url(#mga)"/>
    <path d="M110 362 L150 344 L190 350 L230 318 L270 326 L310 290 L350 272 L372 250" stroke="url(#mg1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="372" cy="250" r="7" fill="#cffbf6"/>
    <rect x="110" y="238" width="96" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.18"/>

    <!-- kolone (kanali) -->
    <rect x="408" y="222" width="140" height="168" rx="14" fill="url(#mg2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="428" y="318" width="20" height="52" rx="6" fill="#abbbe5" opacity="0.8"/>
    <rect x="458" y="290" width="20" height="80" rx="6" fill="#cffbf6" opacity="0.85"/>
    <rect x="488" y="262" width="20" height="108" rx="6" fill="#5dd3f5"/>
    <rect x="518" y="300" width="14" height="70" rx="6" fill="#ffffff" fill-opacity="0.25"/>
  </g>

  <!-- oglas na pretrazi -->
  <g filter="url(#ms)">
    <rect x="404" y="20" width="212" height="74" rx="16" fill="#261a45" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="420" y="36" width="30" height="14" rx="7" fill="url(#mg1)"/>
    <rect x="458" y="38" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="420" y="58" width="150" height="10" rx="5" fill="#5dd3f5" fill-opacity="0.8"/>
    <rect x="420" y="74" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  </g>

  <!-- pin na mapi -->
  <g filter="url(#ms)">
    <path d="M66 388c0-22 18-38 38-38s38 16 38 38c0 28-38 62-38 62s-38-34-38-62z" fill="url(#mg1)"/>
    <circle cx="104" cy="388" r="14" fill="#1a1230"/>
  </g>
</svg>
