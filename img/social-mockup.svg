<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Ilustracija vođenja društvenih mreža">
  <defs>
    <linearGradient id="sg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5dd3f5"/>
      <stop offset=".5" stop-color="#cffbf6"/>
      <stop offset="1" stop-color="#abbbe5"/>
    </linearGradient>
    <linearGradient id="sg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f4698"/>
      <stop offset="1" stop-color="#261a45"/>
    </linearGradient>
    <linearGradient id="sg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d54b8"/>
      <stop offset="1" stop-color="#3b82c4"/>
    </linearGradient>
    <filter id="ss" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#5dd3f5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="320" cy="210" r="220" fill="#5dd3f5" opacity="0.12"/>

  <!-- Telefon (feed) -->
  <g filter="url(#ss)">
    <rect x="232" y="36" width="228" height="408" rx="34" fill="#1a1230" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="244" y="48" width="204" height="384" rx="24" fill="#0d0820"/>

    <!-- Profil zaglavlje -->
    <circle cx="278" cy="92" r="18" fill="url(#sg1)"/>
    <rect x="304" y="83" width="86" height="10" rx="5" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="304" y="99" width="56" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="398" y="84" width="40" height="22" rx="11" fill="url(#sg1)"/>

    <!-- Glavni post -->
    <rect x="256" y="126" width="180" height="150" rx="14" fill="url(#sg3)"/>
    <circle cx="300" cy="176" r="20" fill="#cffbf6" opacity="0.9"/>
    <path d="M268 246l30-26 22 17 20-15 32 24v6H268z" fill="#5dd3f5" opacity="0.55"/>

    <!-- Akcije: like / comment / share -->
    <path d="M270 296c-6-6-14-3-14 5 0 6 9 12 14 15 5-3 14-9 14-15 0-8-8-11-14-5" fill="#ff6b8a"/>
    <circle cx="300" cy="300" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.4"/>
    <path d="M326 292h16a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-9l-5 4v-4a4 4 0 0 1-2-16z" fill="#ffffff" fill-opacity="0.6"/>

    <!-- Engagement linije -->
    <rect x="256" y="322" width="120" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="256" y="340" width="168" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="256" y="356" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>

    <!-- Donja navigacija -->
    <circle cx="276" cy="404" r="7" fill="#cffbf6"/>
    <circle cx="320" cy="404" r="7" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="364" cy="404" r="7" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="408" cy="404" r="7" fill="#ffffff" fill-opacity="0.3"/>
  </g>

  <!-- Leteći „like" i „chat" baloni -->
  <g filter="url(#ss)">
    <circle cx="150" cy="150" r="40" fill="url(#sg2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M150 168c-14-10-24-18-24-30 0-8 6-13 13-13 5 0 9 3 11 6 2-3 6-6 11-6 7 0 13 5 13 13 0 12-10 20-24 30" fill="#ff6b8a"/>
  </g>
  <g filter="url(#ss)">
    <circle cx="500" cy="300" r="46" fill="url(#sg2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M478 286h44a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6h-26l-14 11v-11a6 6 0 0 1-4-32z" fill="url(#sg1)"/>
  </g>
  <g filter="url(#ss)">
    <circle cx="486" cy="132" r="30" fill="url(#sg3)" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M478 132l6 6 12-12" stroke="#0d0820" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
